name: pdf_reader_utility_app
description: "Comprehensive PDF Reader & Utility Application built with Flutter and SQLite"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # PDF Viewing & Manipulation
  syncfusion_flutter_pdfviewer: ^26.1.41
  pdf: ^3.10.8
  printing: ^5.12.0

  # File & Image Selection / Scanner
  file_picker: ^8.0.5
  image_picker: ^1.1.1

  # Notifications & State Management
  flutter_local_notifications: ^17.1.2
  provider: ^6.1.2

  # Utility & Exporting
  share_plus: ^9.0.0
  csv: ^6.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
